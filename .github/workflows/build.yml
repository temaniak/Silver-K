name: Desktop build
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-universal:
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit source-only repository
        run: python tools/check_repository.py
      - name: Configure Win64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build Standalone, VST3 and checks
        run: cmake --build build --config RelWithDebInfo --target silverK_Standalone silverK_VST3 silver_check silverClock_test silverResamplerRealtime_test silverWorkflow_test silverPersistence_test silverDspThreads_test silverLatency_test silverEditor_test silverSkin_test silverPerformance_test silverDiagnostics_test silverWorkerWakeup_test ksWorkerPlacement_test ksDspWorkers_test ksDspEquivalence_test ksControllerTrace_test ksPartMidi_test ksControlArithmetic_test ksProductionController_test ksResetVector_test ksControllerTiming_test ksControllerTimers_test ksControllerMemory_test ksRuntimeController_test ksControllerBoot_test ksControllerUart_test dsp56kTestRunner --parallel 4
      - name: Run DSP JIT, patch, browser and editor checks without ROMs
        env:
          SILVER_K_DATA: '${{ runner.temp }}/silver-k-tests'
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -R '^(silver_conversion|silver_host_clock|silver_resampler_realtime|silver_patch_workflow|silver_persistence_and_rescan|silver_dsp_threads|silver_latency_reentry|silver_native_editor|silver_skin_packages|silver_performance_editor|silver_diagnostics|silver_worker_wakeup|ks_worker_placement|ks_dsp_workers|ks_dsp_equivalence|ks_controller_trace|ks_part_midi|ks_reset_vector|ks_production_controller|ks_control_arithmetic|ks_controller_timing|ks_controller_timers|ks_controller_memory|ks_runtime_controller|ks_controller_boot|ks_controller_uart|dsp56300_unitTests)$'
      - name: Build and test Wave ROM Builder
        run: |
          cmake --build build --config RelWithDebInfo --target silverWaveRomBuilder silverWaveBank_test --parallel 4
          ctest --test-dir build -C RelWithDebInfo --output-on-failure -R '^silver_wave_bank$'
      - name: Verify synthetic flash
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --target silver_create_init_flash
          & build/RelWithDebInfo/silver_create_init_flash.exe "$env:RUNNER_TEMP/ks-init-flash.bin"
          if ((Get-FileHash assets/ks-init-flash.bin).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/ks-init-flash.bin").Hash) { throw 'Init flash is not reproducible' }
